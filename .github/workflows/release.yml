name: Release
on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v26.03-v1.5.7-R1), created on the selected branch if missing'
        required: true

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}

jobs:

  windows:

    strategy:
      matrix:
        include:
          - arch: x86
            runner: windows-2025-vs2026
          - arch: x64
            runner: windows-2025-vs2026
          - arch: arm64
            runner: windows-11-arm

    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v6
        with:
          submodules: true

      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v3 # nosonar
        with:
          msbuild-architecture: ${{ matrix.arch }}

      - name: Find vcvarsall path
        shell: cmd
        run: |
          for /f "usebackq tokens=*" %%i in (`vswhere -latest -property installationPath`) do (
            echo VCVARSALL_PATH=%%i\VC\Auxiliary\Build\vcvarsall.bat >> %GITHUB_ENV%
          )

      - name: Compiling ${{ matrix.arch }}
        shell: cmd
        run: |
          call "%VCVARSALL_PATH%" ${{ matrix.arch }}
          set WDIR=%cd%
          set PLATFORM=${{ matrix.arch }}
          set SUBSYS=6.00
          set ROOT=%cd%\CPP\7zip
          set OUTDIR=%WDIR%\build\bin-%PLATFORM%
          set ZIP7_DARKMODE=1
          set LFLAGS=/SUBSYSTEM:WINDOWS,%SUBSYS%
          set ERRFILE=
          set STOP_ON_ERROR=1

          call CPP\build-it.cmd -no-init
          IF %errorlevel% NEQ 0 EXIT 1

          copy %WDIR%\.github\workflows\do-release-gui.cmd %WDIR%\build\do-release-gui.cmd

      - name: Test
        shell: cmd
        run: |
          set Z7_PATH=build\bin-${{ matrix.arch }}\7z.exe
          tclsh tests\7z-test.tcl -verbose tsem

      - uses: actions/upload-artifact@v6
        with:
          path: ${{ github.workspace }}\build\**\*
          name: release-bin-${{ matrix.arch }}

  publish:
    runs-on: windows-latest
    needs: windows
    steps:
    - uses: actions/download-artifact@v7
      with:
        path: artifact
        pattern: release-bin-*
        merge-multiple: true

    - name: Generate installers
      shell: cmd
      run: |
        cd artifact
        do-release-gui.cmd

    - name: Create Release and upload
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ env.RELEASE_TAG }}
        name: 7-Zip ZS ${{ env.RELEASE_TAG }}
        target_commitish: ${{ github.sha }}
        generate_release_notes: true
        overwrite_files: true
        fail_on_unmatched_files: true
        files: |
          artifact/*.exe
          artifact/*-portable.zip
